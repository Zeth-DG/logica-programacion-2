<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de temperaturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    
  </head>
  <body>
    <main class="content">
      <div class="row">
        <h1>Conversión de temperaturas</h1>

        <label for="iptTempC">Ingresa una temperatura en Celsius</label>
        <input  id="iptTempC" type="number" name="tempCelsius" id="tempCelsius">

        <button id="btnFaKe" type="submit">Convertir a Fahrenheit y Kelvin</button>   
        <!--<button id="btnFahr" type="submit">Convertir solo a Fahrenheit</button>-->
        <!--<button id="btnKel" type="submit">Convertir solo a Kelvin</button>-->

        
        <p id="espacioFahrenheit"></p>
        <p id="espacioKelvin"></p>
      </div>
    </main>


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./main.js"></script>
  </body>
</html>
